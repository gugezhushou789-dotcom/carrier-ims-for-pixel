# Emulator launch test for the Android 10 backport builds.
# Boots a real API 29 (Android 10) x86_64 emulator on a GitHub-hosted
# runner (KVM available there), installs a prebuilt APK, launches the
# main activity and fails the job if the app crashes on launch.
# Trigger manually from the Actions tab (workflow_dispatch) or via API.
# The APK is downloaded from a GitHub Release asset of this fork.
name: Emulator launch test (Android 10)

on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: APK download URL (release asset)
        required: true
        default: https://github.com/gugezhushou789-dotcom/carrier-ims-for-pixel/releases/download/android10-v9/turboims-android10-v9.apk
      apk_sha256:
        description: Expected full SHA-256 of the APK (empty to skip check)
        required: false
        default: 925fa99a56180757e173d57e229cf3cf08415b40dc020f4e71f203c3f72e23d5

jobs:
  launch-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Download APK
        run: |
          curl -L --fail -o /tmp/test.apk "${{ inputs.apk_url }}"
          ls -la /tmp/test.apk
          ACTUAL=$(sha256sum /tmp/test.apk | cut -d" " -f1)
          echo "apk sha256: $ACTUAL"
          if [ -n "${{ inputs.apk_sha256 }}" ] && [ "$ACTUAL" != "${{ inputs.apk_sha256 }}" ]; then
            echo "SHA-256 mismatch! expected ${{ inputs.apk_sha256 }}"
            exit 1
          fi
      - name: Boot emulator and test launch
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: google_apis
          arch: x86_64
          profile: pixel
          ram-size: 2048M
          heap-size: 512M
          disable-animations: true
          emulator-options: -no-snapshot-save -no-boot-anim
          script: |
            touch /tmp/logcat.txt /tmp/focus.txt
            adb install -r /tmp/test.apk
            adb logcat -c
            adb shell am start -n io.github.vvb2060.ims.mod/io.github.vvb2060.ims.ui.MainActivity
            sleep 15
            adb logcat -d > /tmp/logcat.txt
            adb shell dumpsys window windows | grep -i "mCurrentFocus" > /tmp/focus.txt || true
            echo "=== focused window ==="
            cat /tmp/focus.txt
            if grep -q "FATAL EXCEPTION" /tmp/logcat.txt; then
              echo "=== CRASH FOUND ==="
              grep -A 25 "FATAL EXCEPTION" /tmp/logcat.txt
              exit 1
            fi
            echo "=== NO CRASH: app launched without FATAL EXCEPTION ==="
      - name: Upload logcat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logcat
          path: |
            /tmp/logcat.txt
            /tmp/focus.txt
